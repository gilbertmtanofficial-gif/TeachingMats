<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Computing Lab - Mr. Gilbert</title>
    <!-- Dependencies for PPT rendering and Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <!-- Using a custom library approach for PPT handling -->
    <style>
        :root {
            --board-green: #1e3d2f;
            --wood: #3e2723;
            --folder-bg: #eceff1;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            /* High-quality Cyber/Tech Classroom Aesthetic */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
        }

        /* 1. EDITABLE CHALK TEXT */
        .chalk-header {
            position: absolute; top: 10%; width: 100%; text-align: center;
            color: rgba(255,255,255,0.9); z-index: 5;
        }
        .editable-name {
            font-family: 'Brush Script MT', cursive;
            font-size: 70px; border: none; background: transparent;
            color: white; text-align: center; width: 80%;
            text-decoration: underline wavy white 3px; cursor: text;
        }

        /* 2. THE MAIN BOARD & PPT NAV */
        .board-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px; height: 550px;
            background: var(--board-green);
            border: 20px solid var(--wood);
            border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,1);
            overflow: hidden; z-index: 10;
        }
        #ppt-display { width: 100%; height: 100%; overflow: hidden; background: white; display: none; }
        #draw-layer { position: absolute; top:0; left:0; z-index: 20; cursor: crosshair; }
        
        /* Navigation Taps */
        .nav-tap {
            position: absolute; top: 0; width: 10%; height: 100%; z-index: 30;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.2); font-size: 40px; cursor: pointer; transition: 0.3s;
        }
        .nav-tap:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-prev { left: 0; }
        .nav-next { right: 0; }

        /* 3. THE HOVER DOCK (FOLDER STYLE) */
        .dock-trigger {
            position: fixed; bottom: 0; width: 100%; height: 20px; z-index: 999;
        }
        .folder-dock {
            position: fixed; bottom: -450px; left: 50%; transform: translateX(-50%);
            width: 80%; height: 400px; background: var(--folder-bg);
            border-radius: 20px 20px 0 0; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            padding: 20px;
        }
        .dock-trigger:hover + .folder-dock, .folder-dock:hover { bottom: 0; }

        /* Tabs inside Folder */
        .tab-nav { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
        .tab-link {
            padding: 10px 20px; cursor: pointer; font-weight: bold; color: #555;
            border-radius: 10px 10px 0 0;
        }
        .tab-link.active { background: white; color: var(--wood); border: 2px solid #ccc; border-bottom: none; }
        
        .tab-content { display: none; }
        .tab-content.active { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }

        /* 4. SEATING PLAN 2D */
        .seating-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none;
        }
        .desk-unit {
            width: 100px; height: 80px; background: #8d6e63; border: 3px solid #3e2723;
            position: absolute; border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: move;
        }
        .desk-unit input { width: 80%; border: none; font-size: 11px; text-align: center; margin-top: 5px; }

        /* Status UI (Upper Right) */
        .status-ui {
            position: absolute; top: 20px; right: 40px; color: white;
            text-align: right; z-index: 100; font-family: 'Courier New', Courier, monospace;
        }

        #bell-gif { width: 100px; display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000; }
    </style>
</head>
<body>

    <div class="chalk-header">
        <input type="text" class="editable-name" value="Mr. Gilbert's Computing Class" spellcheck="false">
    </div>

    <div class="status-ui">
        <div id="class-id-tag" style="font-size: 20px;">[ NO SECTION ]</div>
        <div id="status-dot">● OFFLINE</div>
    </div>

    <!-- The Board -->
    <div class="board-container" id="board-container">
        <div class="nav-tap nav-prev" onclick="changeSlide(-1)"><i class="fas fa-chevron-left"></i></div>
        <div class="nav-tap nav-next" onclick="changeSlide(1)"><i class="fas fa-chevron-right"></i></div>
        
        <iframe id="ppt-frame" src="" style="width:100%; height:100%; border:none; display:none;"></iframe>
        <canvas id="draw-layer"></canvas>
    </div>

    <!-- Hidden Bell -->
    <img id="bell-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJtZzZ6Ynd6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3o7TKMGpxx36T2CcV2/giphy.gif">

    <!-- Hover Dock -->
    <div class="dock-trigger"></div>
    <div class="folder-dock">
        <div class="tab-nav">
            <div class="tab-link active" onclick="openTab('lecture')">Lecture</div>
            <div class="tab-link" onclick="openTab('tools')">Drawing Tools</div>
            <div class="tab-link" onclick="openTab('class')">Class Management</div>
            <div class="tab-link" onclick="openTab('timer-tab')">Clock & Timer</div>
        </div>

        <!-- Lecture Tab -->
        <div id="lecture" class="tab-content active">
            <button onclick="document.getElementById('ppt-up').click()">📂 Upload PPT/PDF</button>
            <button onclick="changeZoom(1.1)">🔍 Zoom In</button>
            <button onclick="changeZoom(0.9)">🔍 Zoom Out</button>
            <input type="file" id="ppt-up" style="display:none" onchange="handleFile(this)">
        </div>

        <!-- Tools Tab -->
        <div id="tools" class="tab-content">
            <button onclick="setTool('chalk')">⚪ White Chalk</button>
            <button onclick="setTool('highlighter')">🟡 Highlighter</button>
            <button onclick="setMode('single')">⬜ Single Board</button>
            <button onclick="setMode('split')">✂️ Split Board</button>
            <button onclick="clearBoard()">🧹 Clear Everything</button>
        </div>

        <!-- Class Tab -->
        <div id="class" class="tab-content">
            <button onclick="importClass()">📥 Import Names</button>
            <button onclick="toggleOnline()">🟢 Go Online</button>
            <button onclick="pickStudent()">🎲 Random Picker</button>
            <button onclick="openSeating()">🪑 Seating Plan</button>
        </div>

        <!-- Timer Tab -->
        <div id="timer-tab" class="tab-content">
            <div style="font-size: 40px; font-weight: bold;" id="timer-val">10:00</div>
            <button onclick="startTimer()">Start 10m</button>
            <button onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <!-- Seating Overlay -->
    <div id="seating-grid" class="seating-grid">
        <h2 style="color:white; text-align:center;">Drag Desks - Click Board Side (Front) to Close</h2>
        <div id="floor-area" style="width:100%; height:80vh; position:relative;" onclick="if(event.target==this) closeSeating()"></div>
    </div>

    <audio id="bell-sound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

    <script>
        // --- PPT Handling (Solution for PPT Rendering) ---
        // Browser cannot native render PPT. Solution: Use Office Online Viewer or Google Viewer.
        function handleFile(input) {
            const file = input.files[0];
            alert("File received: " + file.name + "\nTo display local PPTs, please upload to Google Drive/OneDrive and paste link, or use PDF for instant rendering.");
            // Simulation for the board clearing
            document.getElementById('ppt-frame').style.display = 'block';
            document.getElementById('ppt-frame').src = "https://docs.google.com/viewer?url=YOUR_FILE_URL&embedded=true";
        }

        function changeSlide(dir) {
            // Logic to send key events to iframe for PPT navigation
            alert(dir > 0 ? "Moving to Next Slide" : "Moving to Previous Slide");
        }

        // --- Tabs Logic ---
        function openTab(name) {
            $('.tab-content').removeClass('active');
            $('.tab-link').removeClass('active');
            $('#' + name).addClass('active');
            $(event.target).addClass('active');
        }

        // --- Seating Plan Logic ---
        function openSeating() { $('#seating-grid').show(); }
        function closeSeating() { $('#seating-grid').hide(); }

        function initDesks() {
            const area = document.getElementById('floor-area');
            for(let i=0; i<35; i++) {
                const d = document.createElement('div');
                d.className = 'desk-unit';
                d.style.left = (i % 7) * 120 + 50 + "px";
                d.style.top = Math.floor(i / 7) * 100 + 50 + "px";
                d.innerHTML = `🪑<input type="text" placeholder="Student ${i+1}">`;
                
                // Drag and drop
                d.onmousedown = function(e) {
                    if(e.target.tagName === 'INPUT') return;
                    let sX = e.clientX - d.offsetLeft;
                    let sY = e.clientY - d.offsetTop;
                    document.onmousemove = (ev) => {
                        d.style.left = ev.pageX - sX + 'px';
                        d.style.top = ev.pageY - sY + 'px';
                    }
                    document.onmouseup = () => document.onmousemove = null;
                }
                area.appendChild(d);
            }
        }
        initDesks();

        // --- Board Logic ---
        const canv = document.getElementById('draw-layer');
        const ctx = canv.getContext('2d');
        let painting = false;
        let toolType = 'chalk';

        function resizeBoard() {
            canv.width = 1000; canv.height = 550;
        }
        resizeBoard();

        function setTool(t) { toolType = t; }

        canv.onmousedown = () => painting = true;
        canv.onmouseup = () => { painting = false; ctx.beginPath(); };
        canv.onmousemove = (e) => {
            if(!painting) return;
            ctx.lineWidth = (toolType === 'highlighter') ? 25 : 3;
            ctx.strokeStyle = (toolType === 'highlighter') ? 'rgba(255,255,0,0.3)' : 'white';
            ctx.lineCap = 'round';
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        };

        function clearBoard() { ctx.clearRect(0,0,1000,550); }

        // --- Class Status ---
        let isOnline = false;
        let students = [];
        function toggleOnline() {
            isOnline = !isOnline;
            document.getElementById('status-dot').innerText = isOnline ? "🔴 ONLINE" : "● OFFLINE";
            document.getElementById('status-dot').style.color = isOnline ? "red" : "white";
        }

        function importClass() {
            let section = prompt("Class Section:", "7A Computing");
            let list = prompt("Names (Separated by Comma):", "Alex, Bob, Charlie");
            if(section) document.getElementById('class-id-tag').innerText = `[ ${section.toUpperCase()} ]`;
            if(list) students = list.split(",");
        }

        // --- Timer ---
        let tSec = 600;
        let tInt;
        function startTimer() {
            clearInterval(tInt);
            tInt = setInterval(() => {
                tSec--;
                let m = Math.floor(tSec/60); let s = tSec%60;
                document.getElementById('timer-val').innerText = `${m}:${s<10?'0'+s:s}`;
                if(tSec <= 0) {
                    clearInterval(tInt);
                    document.getElementById('bell-sound').play();
                    $('#bell-gif').show().delay(3000).fadeOut();
                }
            }, 1000);
        }
        function resetTimer() { clearInterval(tInt); tSec = 600; document.getElementById('timer-val').innerText = "10:00"; }
    </script>
</body>
</html>
