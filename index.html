<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mr. Gilbert's Computing Class</title>
    <style>
        /* Base Setup & Anime Background */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Arial', sans-serif;
            background: url('https://images.unsplash.com/photo-1541339907198-e08756ebafe3?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Top Bar - Presentation Upload */
        .top-bar {
            width: 100%; text-align: center; padding-top: 15px;
        }

        /* The Main Board (Center) */
        .board-wrapper {
            position: relative;
            width: 850px; height: 480px;
            background: #1e3d2f; /* Chalkboard Green */
            border: 18px solid #5d4037; /* Wooden Frame */
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 5;
        }

        .board-title {
            font-size: 85px;
            font-family: 'Comic Sans MS', cursive;
            font-weight: bold;
            margin: 0;
            text-decoration: underline wavy white 6px; /* Chalk strike */
        }

        .board-subtitle {
            font-size: 45px; margin: 10px 0;
        }

        /* Left Side - Seating Button */
        .left-controls {
            position: absolute; left: 40px; top: 40%;
        }

        /* Right Side - Timer */
        .right-controls {
            position: absolute; right: 40px; top: 40%;
            background: rgba(255,255,255,0.9);
            padding: 20px; border-radius: 15px;
            text-align: center; width: 150px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .timer-val { font-size: 35px; font-weight: bold; color: #d32f2f; margin-bottom: 10px; }

        /* Bottom Controls - Clickable Option Boxes */
        .bottom-nav {
            display: flex; gap: 15px; margin-bottom: 40px;
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px;
        }

        .box-btn {
            width: 140px; height: 90px;
            background: #ffffff; border: 4px solid #5d4037;
            border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; text-align: center;
            transition: transform 0.2s, background 0.2s; font-size: 13px;
        }

        .box-btn:hover { transform: scale(1.05); background: #fffde7; }
        .online-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* Canvas & Overlays */
        #drawingCanvas { position: absolute; top:0; left:0; display:none; cursor: crosshair; }
        .split-line { position: absolute; left: 50%; height: 100%; border-left: 3px dashed rgba(255,255,255,0.5); display:none; }
        
        #seatingOverlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 1000;
        }
        .desk { width: 60px; height: 45px; background: #8d6e63; color: white; position: absolute; cursor: move; display: flex; align-items: center; justify-content: center; font-size: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button onclick="document.getElementById('file-up').click()" style="padding: 10px 20px; font-weight: bold; cursor: pointer;">📂 Upload PDF/PPT Lecture</button>
        <input type="file" id="file-up" style="display:none" onchange="alert('Lecture Loaded to Board')">
    </div>

    <div class="left-controls">
        <button class="box-btn" onclick="toggleSeating()">🪑 Arrange<br>Seating</button>
    </div>

    <div class="board-wrapper" id="mainBoard">
        <div id="boardText">
            <h1 class="board-title">Mr. Gilbert</h1>
            <h2 class="board-subtitle">Computing Class</h2>
            <p id="activeClassDisplay">Status: Offline</p>
        </div>
        <div class="split-line" id="splitLine"></div>
        <canvas id="drawingCanvas"></canvas>
    </div>

    <div class="right-controls">
        <div class="timer-val" id="timeDisp">10:00</div>
        <button onclick="startTimer()">Start</button>
        <button onclick="resetTimer()">Reset</button>
        <img id="bellRing" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJtZzZ6Ynd6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3o7TKMGpxx36T2CcV2/giphy.gif" style="width: 80px; margin-top:10px; display:none;">
    </div>

    <div class="bottom-nav">
        <div class="box-btn" onclick="manageClass()">📝 Class List<br>(Import)</div>
        <div class="box-btn" onclick="toggleStatus()">🟢 Set<br>Online/Offline</div>
        <div class="box-btn" onclick="pickName()">🎲 Random<br>Picker</div>
        <div class="box-btn" onclick="initBoard('single')">🖋️ Single<br>Board</div>
        <div class="box-btn" onclick="initBoard('split')">✂️ Split<br>Board</div>
        <div class="box-btn" onclick="resetBoard()">🧹 Clear<br>Board</div>
        <div class="box-btn" onclick="boardZoom(1.1)">🔍 Zoom In</div>
        <div class="box-btn" onclick="boardZoom(0.9)">🔍 Zoom Out</div>
    </div>

    <!-- Seating Modal -->
    <div id="seatingOverlay">
        <h2 style="color:white; text-align:center;">Drag Tables (Max 35) - Board is Front</h2>
        <div id="roomFloor" style="position:relative; width:100%; height:80%;"></div>
        <div style="text-align:center;"><button onclick="toggleSeating()" style="padding:15px 40px;">Close & Save</button></div>
    </div>

    <audio id="bellSnd" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

    <script>
        let timerSeconds = 600;
        let timerInterval;
        let isClassOnline = false;
        let currentScale = 1;
        let students = [];

        // --- Class Status Logic ---
        function toggleStatus() {
            isClassOnline = !isClassOnline;
            const display = document.getElementById('activeClassDisplay');
            if(isClassOnline) {
                display.innerHTML = '<span style="color:#00ff00">●</span> Class On-going';
            } else {
                display.innerHTML = 'Status: Offline';
            }
        }

        function manageClass() {
            let input = prompt("Enter student names (Vinschool ID), comma separated:", "Alex ID01, Ben ID02");
            if(input) students = input.split(",");
        }

        // --- Random Picker ---
        function pickName() {
            if(students.length === 0) return alert("Please import names first!");
            let winner = students[Math.floor(Math.random() * students.length)];
            alert("Selected Student: " + winner);
        }

        // --- Timer Logic ---
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds--;
                let m = Math.floor(timerSeconds/60);
                let s = timerSeconds % 60;
                document.getElementById('timeDisp').innerText = `${m}:${s<10?'0'+s:s}`;
                if(timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('bellSnd').play();
                    document.getElementById('bellRing').style.display = 'block';
                }
            }, 1000);
        }
        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = 600;
            document.getElementById('timeDisp').innerText = "10:00";
            document.getElementById('bellRing').style.display = 'none';
        }

        // --- Board Zoom ---
        function boardZoom(amt) {
            currentScale *= amt;
            document.getElementById('mainBoard').style.transform = `scale(${currentScale})`;
        }

        // --- Drawing Board ---
        const canv = document.getElementById('drawingCanvas');
        const ctx = canv.getContext('2d');
        let drawing = false;

        function initBoard(mode) {
            canv.style.display = 'block';
            document.getElementById('boardText').style.opacity = '0.1';
            canv.width = 850; canv.height = 480;
            ctx.strokeStyle = "white"; ctx.lineWidth = 4;
            document.getElementById('splitLine').style.display = (mode === 'split') ? 'block' : 'none';
        }

        function resetBoard() {
            canv.style.display = 'none';
            document.getElementById('boardText').style.opacity = '1';
            document.getElementById('splitLine').style.display = 'none';
            ctx.clearRect(0,0,850,480);
        }

        canv.onmousedown = () => drawing = true;
        canv.onmouseup = () => { drawing = false; ctx.beginPath(); };
        canv.onmousemove = (e) => {
            if(!drawing) return;
            ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke();
        };

        // --- Seating Logic ---
        function toggleSeating() {
            const overlay = document.getElementById('seatingOverlay');
            overlay.style.display = (overlay.style.display === 'block') ? 'none' : 'block';
        }

        function initDesks() {
            const floor = document.getElementById('roomFloor');
            for(let i=1; i<=35; i++) {
                const d = document.createElement('div');
                d.className = 'desk';
                d.innerText = 'Desk ' + i;
                d.style.left = (i % 7) * 110 + 100 + 'px';
                d.style.top = Math.floor(i / 7) * 80 + 100 + 'px';
                d.onmousedown = function(e) {
                    let sX = e.clientX - d.getBoundingClientRect().left;
                    let sY = e.clientY - d.getBoundingClientRect().top;
                    document.onmousemove = (e) => {
                        d.style.left = e.pageX - sX + 'px';
                        d.style.top = e.pageY - sY + 'px';
                    };
                    document.onmouseup = () => document.onmousemove = null;
                };
                floor.appendChild(d);
            }
        }
        initDesks();
    </script>
</body>
</html>
